name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  back-end:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/back-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/back-end/package-lock.json
      # --ignore-scripts: azure-functions-core-tools' postinstall downloads a
      # ~1.5GB runtime binary we never need here — build/test only exercise
      # tsc + vitest, not `func` itself.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:unit

  front-end:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/front-end/package-lock.json
      - run: npm ci
      - run: npm run build
